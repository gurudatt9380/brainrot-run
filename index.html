<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainrot Run 💀</title>

  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; }

    /* Top Translucent White HUD Header */
    .hud-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .logo-container { display: flex; flex-direction: column; }
    .logo-title { font-size: 34px; font-weight: 900; color: #0f172a; line-height: 1; letter-spacing: -1px; }
    .logo-sub { font-size: 12px; font-weight: 700; color: #ef4444; letter-spacing: 1.5px; margin-top: 4px; }

    .score-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      display: flex;
      gap: 48px;
      align-items: center;
    }

    .score-box { text-align: center; }
    .score-value { font-size: 46px; font-weight: 900; color: #0f172a; line-height: 1; font-mono: monospace; }
    .max-score-value { font-size: 46px; font-weight: 900; color: #2563eb; line-height: 1; font-mono: monospace; }
    .score-label { font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 1px; margin-top: 2px; }

    .timer-card {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 22px;
      text-align: center;
      min-width: 130px;
    }
    .timer-value { font-size: 28px; font-weight: 800; color: #0f172a; font-family: monospace; }
    .timer-label { font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 1px; }

    /* Meme Popup Effects */
    #meme-popup {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 52px;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 20px #ffffff;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 15;
      white-space: nowrap;
    }
    #meme-popup.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1) rotate(-3deg);
    }

    /* Status Pill */
    .status-pill {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      color: #0f172a;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.9);
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .controls-text { font-size: 13px; font-weight: 600; color: #475569; letter-spacing: 0.5px; }

    /* Overlay / Start screen */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .start-btn {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      transition: all 0.2s ease;
    }
    .start-btn:hover { transform: translateY(-2px); background: #1e293b; }
  </style>
</head>
<body>

  <div id="app">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="meme-popup">MAX RIZZ! 🔥</div>

    <!-- Top Translucent Header HUD -->
    <div class="hud-header">
      <div class="logo-container">
        <span class="logo-title">BRAINROT RUN</span>
        <span class="logo-sub">HEAD DODGE CHALLENGE</span>
      </div>
      <div class="score-container">
        <div class="score-box">
          <div id="score" class="score-value">0</div>
          <div class="score-label">SCORE</div>
        </div>
        <div class="score-box">
          <div id="max_score" class="max-score-value">0</div>
          <div class="score-label">BEST MAX</div>
        </div>
      </div>
      <div class="timer-card">
        <div id="timer" class="timer-value">60.0</div>
        <div class="timer-label">SECONDS</div>
      </div>
    </div>

    <!-- Status Pill -->
    <div id="status_pill" class="status-pill">PRESS SPACE OR CLICK START</div>

    <!-- Bottom Control Bar -->
    <div class="bottom-bar">
      <div class="controls-text">SPACE / TAP: START / RESTART &nbsp;&nbsp;&nbsp;&nbsp; TILT HEAD LEFT / RIGHT TO DODGE</div>
    </div>

    <!-- Start Overlay -->
    <div id="start_overlay" class="overlay">
      <h1 style="font-size: 42px; font-weight: 900; color: #0f172a; margin-bottom: 12px;">BRAINROT RUN 💀</h1>
      <p style="font-size: 16px; color: #64748b; margin-bottom: 32px; text-align: center; max-width: 420px;">
        Allow camera permissions, tilt your head left and right to dodge falling emojis!
      </p>
      <button class="start-btn" onclick="initAndStart()">ALLOW CAMERA & START</button>
    </div>
  </div>

  <script>
    const ROUND_SECONDS = 60.0;
    const OBSTACLE_EMOJIS = ['🗿', '💀', '💩', '🤡', '🚽', '🔥', '🤓', '💅'];
    const MEME_TEXTS = ['SKIBIDI DODGE! 🚽', 'MAX RIZZ! 🔥', 'OHIO MOVES! 💀', 'NO BRAINROT TODAY! 🗿', 'GIGA CHAD! 💪'];

    let videoElement = document.getElementById('webcam');
    let canvas = document.getElementById('output_canvas');
    let ctx = canvas.getContext('2d');

    let isGameRunning = false;
    let cameraStarted = false;
    let score = 0;
    let maxScore = parseInt(localStorage.getItem('brainrot_max_score') || '0');
    let timeRemaining = ROUND_SECONDS;
    let lastTime = 0;

    let playerLane = 1; // 0: Left, 1: Center, 2: Right
    let playerX = 0;
    let noseXNormalized = 0.5;
    let noseYNormalized = 0.5;
    let headBox = null;

    let obstacles = [];
    let spawnTimer = 0;

    // Web Audio Synthesizers for Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    document.getElementById('max_score').innerText = maxScore;

    // Trigger Popup Effects for recording reaction clips
    function showMemePopup(text) {
      const popup = document.getElementById('meme-popup');
      popup.innerText = text || MEME_TEXTS[Math.floor(Math.random() * MEME_TEXTS.length)];
      popup.classList.add('active');
      playBeep(587.33, 'triangle', 0.2); // Fun high chime
      setTimeout(() => popup.classList.remove('active'), 1200);
    }

    // Initialize MediaPipe Face Mesh
    async function initAndStart() {
      document.getElementById('start_overlay').style.display = 'none';
      document.getElementById('status_pill').innerText = "INITIALIZING CAMERA...";

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });

      try {
        await camera.start();
        cameraStarted = true;
        resetGame();
      } catch (e) {
        alert("Camera permission is required to play!");
        document.getElementById('status_pill').innerText = "CAMERA ACCESS DENIED";
      }
    }

    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

      const landmarks = results.multiFaceLandmarks[0];
      const nose = landmarks[1];

      // Mirror horizontally
      noseXNormalized = 1.0 - nose.x;
      noseYNormalized = nose.y;

      // Calculate bounding box for head overlay
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      landmarks.forEach(pt => {
        const mx = 1.0 - pt.x;
        if (mx < minX) minX = mx;
        if (mx > maxX) maxX = mx;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      });
      headBox = { minX, maxX, minY, maxY };

      // Determine Lane
      if (noseXNormalized < 0.42) {
        playerLane = 0; // Left
      } else if (noseXNormalized > 0.58) {
        playerLane = 2; // Right
      } else {
        playerLane = 1; // Center
      }
    }

    function resetGame() {
      score = 0;
      timeRemaining = ROUND_SECONDS;
      obstacles = [];
      spawnTimer = 0;
      isGameRunning = true;
      lastTime = performance.now();

      document.getElementById('score').innerText = '0';
      document.getElementById('status_pill').innerText = "RUNNING — TILT HEAD TO DODGE!";
      document.getElementById('status_pill').style.color = '#0f172a';

      playBeep(440, 'sine', 0.15);
      requestAnimationFrame(gameLoop);
    }

    function gameOver(reason) {
      isGameRunning = false;
      playBeep(150, 'sawtooth', 0.4); // Game over buzz

      if (score > maxScore) {
        maxScore = score;
        localStorage.setItem('brainrot_max_score', maxScore);
        document.getElementById('max_score').innerText = maxScore;
        showMemePopup("NEW HIGH SCORE! 🏆");
      }

      document.getElementById('status_pill').innerText = reason || "GAME OVER! PRESS SPACE TO RESTART";
      document.getElementById('status_pill').style.color = '#ef4444';
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const emoji = OBSTACLE_EMOJIS[Math.floor(Math.random() * OBSTACLE_EMOJIS.length)];
      obstacles.push({
        lane: lane,
        y: -60,
        speed: 420 + Math.random() * 160,
        emoji: emoji
      });
    }

    function gameLoop(now) {
      // Resize canvas to match window view
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (isGameRunning) {
        timeRemaining -= delta;
        if (timeRemaining <= 0) {
          timeRemaining = 0;
          gameOver("SURVIVED! MAX RIZZ 🗿");
          return;
        }

        score += Math.floor(delta * 100);
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeRemaining.toFixed(1);

        // Spawn logic
        spawnTimer += delta;
        if (spawnTimer > 0.65) {
          spawnObstacle();
          spawnTimer = 0;
        }

        // Periodic Meme popups for clips
        if (Math.random() < 0.003) showMemePopup();
      }

      // Draw Camera Frame
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      // Dim Background Video for Readability
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Clean Lane Lines
      const laneWidth = canvas.width / 3;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(laneWidth, 0); ctx.lineTo(laneWidth, canvas.height);
      ctx.moveTo(laneWidth * 2, 0); ctx.lineTo(laneWidth * 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Head Tracking Indicator
      if (headBox) {
        const hx = headBox.minX * canvas.width;
        const hy = headBox.minY * canvas.height;
        const hw = (headBox.maxX - headBox.minX) * canvas.width;
        const hh = (headBox.maxY - headBox.minY) * canvas.height;

        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.strokeRect(hx, hy, hw, hh);

        // Nose Dot
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(noseXNormalized * canvas.width, noseYNormalized * canvas.height, 8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        if (isGameRunning) obs.y += obs.speed * delta;

        const obsX = obs.lane * laneWidth + laneWidth / 2;

        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(obs.emoji, obsX, obs.y);

        // Collision Check
        const playerY = canvas.height - 100;
        if (isGameRunning && Math.abs(obs.y - playerY) < 45 && obs.lane === playerLane) {
          gameOver("HIT BY BRAINROT! 💀");
        }

        if (obs.y > canvas.height + 60) {
          obstacles.splice(i, 1);
        }
      }

      // Smooth Player Movement
      const targetX = playerLane * laneWidth + laneWidth / 2;
      playerX += (targetX - playerX) * 0.25;

      // Draw Player Base & Marker
      const playerY = canvas.height - 100;
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.arc(playerX, playerY, 32, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏃', playerX, playerY + 9);

      if (isGameRunning) {
        requestAnimationFrame(gameLoop);
      }
    }

    // Key & Touch Controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyR') {
        if (cameraStarted) resetGame();
      }
    });

    window.addEventListener('click', (e) => {
      if (cameraStarted && !isGameRunning && e.target.tagName !== 'BUTTON') {
        resetGame();
      }
    });
  </script>
</body>
</html>
