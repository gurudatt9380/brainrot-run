<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BRainrot Run 💀</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d0614;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #140924;
      border: 4px solid #ff00d4;
      box-shadow: 0 0 20px #ff00d4, inset 0 0 20px #ff00d4;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Header */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00ffff;
      padding: 8px 16px;
      text-align: center;
      box-shadow: 3px 3px 0 #00ffff;
    }

    .hud-title { font-size: 10px; color: #aaa; text-transform: uppercase; }
    .hud-value { font-size: 24px; font-weight: bold; color: #ffe600; }

    /* Video Feed Overlay */
    #webcam-container {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 160px;
      height: 120px;
      border: 2px solid #00ffff;
      background: #000;
      overflow: hidden;
      z-index: 10;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .cam-status {
      position: absolute;
      bottom: 2px;
      width: 100%;
      text-align: center;
      font-size: 9px;
      background: rgba(0,0,0,0.8);
      color: #ffe600;
    }

    /* Modals */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(13, 6, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 48px;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 4px 4px 0 #ff00d4, -3px -3px 0 #00ffff;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #00ffff;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .instructions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 500px;
    }

    .instruction-box {
      background: #1a0b30;
      border: 1px solid #444;
      padding: 10px;
    }

    .instruction-box b { display: block; font-size: 20px; color: #fff; margin-bottom: 5px;}
    .instruction-box span { font-size: 11px; color: #aaa; }

    .btn {
      border: none;
      cursor: pointer;
      background: #ffe600;
      color: #000;
      font-weight: 900;
      font-size: 20px;
      padding: 14px 32px;
      box-shadow: 5px 5px 0 #ff00d4, -3px -3px 0 #00ffff;
      transition: transform 0.1s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #ff00d4, -1px -1px 0 #00ffff;
    }

    .btn:disabled {
      background: #555;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-title">Time</div>
        <div class="hud-value" id="timer">60.0</div>
      </div>
      <div class="hud-box">
        <div class="hud-title">Score</div>
        <div class="hud-value" id="score">0</div>
      </div>
    </div>

    <div id="webcam-container">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="cam-status" id="cam-status">CAMERA OFF</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- START MODAL -->
    <div class="modal" id="start-modal">
      <h1 class="title">BRainrot RUN 💀</h1>
      <p class="subtitle">HOW LONG CAN YOUR BRAIN SURVIVE?</p>

      <div class="instructions">
        <div class="instruction-box">
          <b>&larr;</b>
          <span>HEAD LEFT</span>
        </div>
        <div class="instruction-box">
          <b>&bullet;</b>
          <span>HEAD CENTER</span>
        </div>
        <div class="instruction-box">
          <b>&rarr;</b>
          <span>HEAD RIGHT</span>
        </div>
      </div>

      <p style="font-size: 12px; color: #888; margin-bottom: 15px;">Avoid the obstacles for 60 seconds.</p>

      <button class="btn" id="cam-btn" onclick="requestCameraAccess()">📷 ALLOW CAMERA / UNLOCK GAME</button>
      <button class="btn hidden" id="start-btn" onclick="startGame()">START RUN 💀</button>
      <p style="font-size: 10px; color: #ff00d4; margin-top: 12px;" id="cam-note">Camera access is required each session</p>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="modal hidden" id="gameover-modal">
      <h1 class="title" style="color: #ff0055;">GAME OVER 💀</h1>
      <p class="subtitle" id="final-stats">SCORE: 0</p>
      <button class="btn" onclick="resetToMenu()">MAIN MENU 🔄</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentStream = null;
    let cameraActive = false;
    let gameRunning = false;
    let playerLane = 1; // 0: Left, 1: Center, 2: Right
    let score = 0;
    let timeRemaining = 60.0;
    let lastTime = 0;

    const camBtn = document.getElementById('cam-btn');
    const startBtn = document.getElementById('start-btn');
    const camStatus = document.getElementById('cam-status');
    const video = document.getElementById('webcam');

    // Enable/Prompt camera explicit user gesture
    async function requestCameraAccess() {
      stopCameraTracks(); // Ensure fresh request

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 320, height: 240, facingMode: 'user' }
        });
        video.srcObject = currentStream;
        cameraActive = true;
        camStatus.innerText = "CAMERA ON";
        camStatus.style.color = "#00ffcc";

        camBtn.classList.add('hidden');
        startBtn.classList.remove('hidden');
        document.getElementById('cam-note').innerText = "CAMERA CONNECTED! CLICK START RUN";
      } catch (err) {
        alert("Camera permission denied or device not found! Please allow camera access.");
        console.error(err);
      }
    }

    function stopCameraTracks() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      cameraActive = false;
      camStatus.innerText = "CAMERA OFF";
      camStatus.style.color = "#ffe600";
    }

    function startGame() {
      if (!cameraActive) {
        alert("Camera required!");
        return;
      }

      document.getElementById('start-modal').classList.add('hidden');
      document.getElementById('gameover-modal').classList.add('hidden');

      score = 0;
      timeRemaining = 60.0;
      gameRunning = true;
      lastTime = performance.now();

      requestAnimationFrame(gameLoop);
    }

    function resetToMenu() {
      gameRunning = false;
      stopCameraTracks(); // Force stop camera track so browser re-prompts/re-opens next run

      startBtn.classList.add('hidden');
      camBtn.classList.remove('hidden');
      document.getElementById('cam-note').innerText = "Camera access is required each session";

      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('start-modal').classList.remove('hidden');
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('final-stats').innerText = `FINAL SCORE: ${Math.floor(score)}`;
      document.getElementById('gameover-modal').classList.remove('hidden');
    }

    function gameLoop(now) {
      if (!gameRunning) return;

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      timeRemaining -= delta;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver();
        return;
      }

      score += delta * 100;

      document.getElementById('timer').innerText = timeRemaining.toFixed(1);
      document.getElementById('score').innerText = Math.floor(score);

      // Render simple game canvas
      ctx.fillStyle = '#140924';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render lanes
      ctx.strokeStyle = '#ff00d4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
      ctx.moveTo((canvas.width / 3) * 2, 0); ctx.lineTo((canvas.width / 3) * 2, canvas.height);
      ctx.stroke();

      // Render Player
      const laneWidth = canvas.width / 3;
      const playerX = playerLane * laneWidth + laneWidth / 2;
      ctx.fillStyle = '#ffe600';
      ctx.beginPath();
      ctx.arc(playerX, canvas.height - 80, 25, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
