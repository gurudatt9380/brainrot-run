<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brainrot Run</title>

  <!-- MediaPipe Face Mesh Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Video Feed Background */
    #webcam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.25; /* Subtle background camera preview */
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* Minimalist Top HUD Header */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-stat {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 18px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .hud-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-value {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      font-mono: monospace;
    }

    /* Modals */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      max-width: 400px;
      line-height: 1.5;
    }

    .btn {
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      padding: 12px 28px;
      border-radius: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .status-badge {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- TOP HUD -->
    <div class="hud">
      <div class="hud-stat">
        <div class="hud-label">Time</div>
        <div class="hud-value" id="timer">60.0s</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">Best</div>
        <div class="hud-value" id="high-score">0</div>
      </div>
    </div>

    <!-- START MODAL -->
    <div class="modal" id="start-modal">
      <h1 class="title">Brainrot Run</h1>
      <p class="subtitle">Tilt your head left or right to switch lanes and avoid falling obstacles.</p>

      <button class="btn" id="cam-btn" onclick="initMediaPipe()">Enable Camera & Start</button>
      <button class="btn" id="start-btn" style="display: none;" onclick="startGame()">Start Game</button>
      <p class="status-badge" id="status-badge"></p>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="modal" id="gameover-modal" style="display: none;">
      <h1 class="title">Game Over</h1>
      <p class="subtitle" id="final-stats">Score: 0 | Best: 0</p>
      <button class="btn" onclick="resetToMenu()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const videoElement = document.getElementById('webcam');

    const camBtn = document.getElementById('cam-btn');
    const startBtn = document.getElementById('start-btn');
    const statusBadge = document.getElementById('status-badge');

    let gameRunning = false;
    let playerLane = 1; // 0: Left, 1: Center, 2: Right
    let playerX = 400;
    let headTrackerX = 400;
    let headTrackerY = 300;
    let score = 0;
    let highScore = localStorage.getItem('brainrot_high_score') || 0;
    let timeRemaining = 60.0;
    let lastTime = 0;
    let obstacles = [];
    let obstacleSpawnTimer = 0;

    const OBSTACLE_ITEMS = ['🗿', '💀', '💩', '🤡', '🚽'];

    // Display loaded High Score
    document.getElementById('high-score').innerText = highScore;

    // --- MEDIAPIPE FACE TRACKING ---
    async function initMediaPipe() {
      statusBadge.innerText = "Initializing face tracking...";
      
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 800,
        height: 600
      });

      try {
        await camera.start();
        statusBadge.innerText = "Tracking active";
        statusBadge.style.color = "#4ade80";
        camBtn.style.display = 'none';
        startBtn.style.display = 'inline-block';
      } catch (err) {
        alert("Camera permission required!");
        statusBadge.innerText = "Camera error";
        statusBadge.style.color = "#f87171";
      }
    }

    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

      const landmarks = results.multiFaceLandmarks[0];
      const nose = landmarks[1]; // Landmark 1 is the nose tip

      // Mirror X position for intuitive movement
      const mirroredX = 1.0 - nose.x;
      headTrackerX = mirroredX * canvas.width;
      headTrackerY = nose.y * canvas.height;

      // Lane thresholds
      if (mirroredX < 0.42) {
        playerLane = 0; // Left
      } else if (mirroredX > 0.58) {
        playerLane = 2; // Right
      } else {
        playerLane = 1; // Center
      }
    }

    // --- GAME ENGINE ---
    function startGame() {
      document.getElementById('start-modal').style.display = 'none';
      document.getElementById('gameover-modal').style.display = 'none';

      score = 0;
      timeRemaining = 60.0;
      obstacles = [];
      gameRunning = true;
      lastTime = performance.now();

      requestAnimationFrame(gameLoop);
    }

    function resetToMenu() {
      gameRunning = false;
      document.getElementById('gameover-modal').style.display = 'none';
      document.getElementById('start-modal').style.display = 'flex';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function gameOver() {
      gameRunning = false;
      
      // Update high score
      if (Math.floor(score) > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('brainrot_high_score', highScore);
        document.getElementById('high-score').innerText = highScore;
      }

      document.getElementById('final-stats').innerText = `Final Score: ${Math.floor(score)} | Best: ${highScore}`;
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const emoji = OBSTACLE_ITEMS[Math.floor(Math.random() * OBSTACLE_ITEMS.length)];
      obstacles.push({
        lane: lane,
        y: -40,
        speed: 380 + Math.random() * 120,
        emoji: emoji
      });
    }

    function gameLoop(now) {
      if (!gameRunning) return;

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      timeRemaining -= delta;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver();
        return;
      }

      score += delta * 100;
      document.getElementById('timer').innerText = `${timeRemaining.toFixed(1)}s`;
      document.getElementById('score').innerText = Math.floor(score);

      // Spawn Obstacles
      obstacleSpawnTimer += delta;
      if (obstacleSpawnTimer > 0.75) {
        spawnObstacle();
        obstacleSpawnTimer = 0;
      }

      // Smooth position transition
      const laneWidth = canvas.width / 3;
      const targetX = playerLane * laneWidth + laneWidth / 2;
      playerX += (targetX - playerX) * 0.2;

      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Subtle Lane Dividers
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
      ctx.moveTo((canvas.width / 3) * 2, 0); ctx.lineTo((canvas.width / 3) * 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Head Tracking Indicator Dot
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(headTrackerX, headTrackerY, 6, 0, Math.PI * 2);
      ctx.fill();

      // Update & Render Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed * delta;

        const obsX = obs.lane * laneWidth + laneWidth / 2;

        ctx.font = '36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(obs.emoji, obsX, obs.y);

        // Collision Detection
        const playerY = canvas.height - 70;
        if (Math.abs(obs.y - playerY) < 32 && obs.lane === playerLane) {
          gameOver();
          return;
        }

        if (obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
        }
      }

      // Render Player Base
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(playerX, canvas.height - 70, 22, 0, Math.PI * 2);
      ctx.fill();

      // Player Symbol
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏃', playerX, canvas.height - 63);

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
