<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BRainrot Run 💀</title>

  <!-- MediaPipe Face Mesh Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d0614;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #140924;
      border: 4px solid #ff00d4;
      box-shadow: 0 0 25px #ff00d4, inset 0 0 20px #ff00d4;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Header */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ffff;
      padding: 8px 16px;
      text-align: center;
      box-shadow: 3px 3px 0 #00ffff;
    }

    .hud-title { font-size: 10px; color: #aaa; text-transform: uppercase; }
    .hud-value { font-size: 24px; font-weight: bold; color: #ffe600; }

    /* Video Feed Overlay */
    #webcam-container {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 160px;
      height: 120px;
      border: 2px solid #00ffff;
      background: #000;
      overflow: hidden;
      z-index: 10;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .cam-status {
      position: absolute;
      bottom: 2px;
      width: 100%;
      text-align: center;
      font-size: 9px;
      background: rgba(0,0,0,0.85);
      color: #ffe600;
      padding: 2px 0;
    }

    /* Modals */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(13, 6, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 44px;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 4px 4px 0 #ff00d4, -3px -3px 0 #00ffff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #00ffff;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .instructions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 480px;
    }

    .instruction-box {
      background: #1a0b30;
      border: 1px solid #ff00d4;
      padding: 10px;
    }

    .instruction-box b { display: block; font-size: 22px; color: #ffe600; margin-bottom: 4px; }
    .instruction-box span { font-size: 11px; color: #aaa; }

    .btn {
      border: none;
      cursor: pointer;
      background: #ffe600;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      padding: 12px 28px;
      box-shadow: 4px 4px 0 #ff00d4, -2px -2px 0 #00ffff;
      transition: transform 0.1s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #ff00d4;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-box">
        <div class="hud-title">Time</div>
        <div class="hud-value" id="timer">60.0</div>
      </div>
      <div class="hud-box">
        <div class="hud-title">Score</div>
        <div class="hud-value" id="score">0</div>
      </div>
    </div>

    <div id="webcam-container">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="cam-status" id="cam-status">INIT CAMERA...</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- START MODAL -->
    <div class="modal" id="start-modal">
      <h1 class="title">BRainrot RUN 💀</h1>
      <p class="subtitle">DODGE THE BRAINROT WITH YOUR HEAD!</p>

      <div class="instructions">
        <div class="instruction-box">
          <b>&larr;</b>
          <span>TILT LEFT</span>
        </div>
        <div class="instruction-box">
          <b>&bullet;</b>
          <span>CENTER</span>
        </div>
        <div class="instruction-box">
          <b>&rarr;</b>
          <span>TILT RIGHT</span>
        </div>
      </div>

      <button class="btn" id="cam-btn" onclick="initMediaPipe()">📷 ENABLE CAMERA & START</button>
      <button class="btn" id="start-btn" style="display: none;" onclick="startGame()">START RUN 💀</button>
      <p style="font-size: 10px; color: #ff00d4; margin-top: 12px;" id="cam-note">Allow camera permissions when prompted</p>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="modal" id="gameover-modal" style="display: none;">
      <h1 class="title" style="color: #ff0055;">GAME OVER 💀</h1>
      <p class="subtitle" id="final-stats">SCORE: 0</p>
      <button class="btn" onclick="resetToMenu()">PLAY AGAIN 🔄</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const videoElement = document.getElementById('webcam');
    const camStatus = document.getElementById('cam-status');
    const camBtn = document.getElementById('cam-btn');
    const startBtn = document.getElementById('start-btn');

    let gameRunning = false;
    let playerLane = 1; // 0: Left, 1: Center, 2: Right
    let targetX = 400;
    let playerX = 400;
    let score = 0;
    let timeRemaining = 60.0;
    let lastTime = 0;
    let obstacles = [];
    let obstacleSpawnTimer = 0;

    const OBSTACLE_EMOJIS = ['🗿', '💀', '💩', '🤡', '🚽'];

    // --- MEDIAPIPE FACE TRACKING SETUP ---
    async function initMediaPipe() {
      camStatus.innerText = "LOADING AI...";
      
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });

      try {
        await camera.start();
        camStatus.innerText = "TRACKING READY";
        camStatus.style.color = "#00ffcc";
        camBtn.style.display = 'none';
        startBtn.style.display = 'inline-block';
        document.getElementById('cam-note').innerText = "HEAD TRACKING ACTIVE! CLICK START";
      } catch (err) {
        alert("Unable to access webcam. Please check permissions!");
        camStatus.innerText = "CAM ERROR";
      }
    }

    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

      const landmarks = results.multiFaceLandmarks[0];
      // Landmark 1 is the tip of the nose
      const noseX = landmarks[1].x; 

      // Mirrored horizontal position (0.0 to 1.0)
      const mirroredX = 1.0 - noseX;

      // Determine lane based on nose offset thresholds
      if (mirroredX < 0.42) {
        playerLane = 0; // Left
      } else if (mirroredX > 0.58) {
        playerLane = 2; // Right
      } else {
        playerLane = 1; // Center
      }
    }

    // --- GAME LOOP & LOGIC ---
    function startGame() {
      document.getElementById('start-modal').style.display = 'none';
      document.getElementById('gameover-modal').style.display = 'none';

      score = 0;
      timeRemaining = 60.0;
      obstacles = [];
      gameRunning = true;
      lastTime = performance.now();

      requestAnimationFrame(gameLoop);
    }

    function resetToMenu() {
      gameRunning = false;
      document.getElementById('gameover-modal').style.display = 'none';
      document.getElementById('start-modal').style.display = 'flex';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('final-stats').innerText = `FINAL SCORE: ${Math.floor(score)}`;
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const emoji = OBSTACLE_EMOJIS[Math.floor(Math.random() * OBSTACLE_EMOJIS.length)];
      obstacles.push({
        lane: lane,
        y: -50,
        speed: 350 + Math.random() * 150,
        emoji: emoji
      });
    }

    function gameLoop(now) {
      if (!gameRunning) return;

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      timeRemaining -= delta;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver();
        return;
      }

      score += delta * 100;
      document.getElementById('timer').innerText = timeRemaining.toFixed(1);
      document.getElementById('score').innerText = Math.floor(score);

      // Spawn Obstacles
      obstacleSpawnTimer += delta;
      if (obstacleSpawnTimer > 0.8) {
        spawnObstacle();
        obstacleSpawnTimer = 0;
      }

      // Smooth movement interpolating to current lane position
      const laneWidth = canvas.width / 3;
      targetX = playerLane * laneWidth + laneWidth / 2;
      playerX += (targetX - playerX) * 0.2;

      // Clear Canvas
      ctx.fillStyle = '#140924';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Lanes
      ctx.strokeStyle = '#ff00d4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
      ctx.moveTo((canvas.width / 3) * 2, 0); ctx.lineTo((canvas.width / 3) * 2, canvas.height);
      ctx.stroke();

      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed * delta;

        const obsX = obs.lane * laneWidth + laneWidth / 2;

        ctx.font = '40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(obs.emoji, obsX, obs.y);

        // Collision Check
        const playerY = canvas.height - 70;
        if (Math.abs(obs.y - playerY) < 35 && obs.lane === playerLane) {
          gameOver();
          return;
        }

        // Remove Off-screen Obstacles
        if (obs.y > canvas.height + 50) {
          obstacles.splice(i, 1);
        }
      }

      // Draw Player
      ctx.fillStyle = '#ffe600';
      ctx.shadowColor = '#ff00d4';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(playerX, canvas.height - 70, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Player Face Icon
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏃', playerX, canvas.height - 62);

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
