<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Catch - Computer Vision Challenge</title>
  
  <!-- MediaPipe Hand Tracking Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 15px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    #game-container {
      position: relative;
      width: 640px;
      height: 480px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #38bdf8;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
    }

    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }

    .badge {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #game-over-screen.hidden {
      display: none;
    }

    h1 {
      font-size: 44px;
      margin: 0 0 10px 0;
      color: #ef4444;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .stat {
      font-size: 22px;
      margin: 6px 0;
    }

    button {
      margin-top: 25px;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    #instructions {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="title">⚡ Vision Gesture Challenge ⚡</div>

  <div id="game-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <div id="ui-overlay">
      <div class="badge">Score: <span id="current-score" style="color: #38bdf8;">0</span></div>
      <div class="badge">🏆 Best: <span id="high-score" style="color: #f59e0b;">0</span></div>
    </div>

    <div id="game-over-screen">
      <h1>GAME OVER</h1>
      <div class="stat">Score: <span id="final-score" style="color: #38bdf8;">0</span></div>
      <div class="stat">High Score: <span id="best-score" style="color: #f59e0b;">0</span></div>
      <button onclick="resetGame()">Play Again 🔄</button>
    </div>
  </div>

  <div id="instructions">
    ☝️ Move your <b>Index Finger Tip</b> to catch 🌟 <b>Golden Orbs (+10 pts)</b>.<br>
    ⚠️ Avoid 💣 <b>Red Bombs</b> and don't let orbs fall past the bottom!
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('current-score');
    const highScoreEl = document.getElementById('high-score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const gameOverScreen = document.getElementById('game-over-screen');

    let score = 0;
    let highScore = localStorage.getItem('cv_challenge_best') || 0;
    highScoreEl.innerText = highScore;

    let isGameOver = false;
    
    // Smooth Catcher Coordinates
    let rawX = canvas.width / 2;
    let rawY = canvas.height / 2;
    let playerX = canvas.width / 2;
    let playerY = canvas.height / 2;

    // Objects
    let items = [];
    let speedMultiplier = 1;

    function spawnItem() {
      const isBomb = Math.random() < 0.25; // 25% chance of bomb
      items.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -20,
        radius: isBomb ? 16 : 20,
        speed: (Math.random() * 2 + 3) * speedMultiplier,
        isBomb: isBomb
      });
    }

    function resetGame() {
      score = 0;
      speedMultiplier = 1;
      items = [];
      scoreEl.innerText = score;
      isGameOver = false;
      gameOverScreen.classList.add('hidden');
    }

    function endGame() {
      isGameOver = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cv_challenge_best', highScore);
        highScoreEl.innerText = highScore;
      }
      finalScoreEl.innerText = score;
      bestScoreEl.innerText = highScore;
      gameOverScreen.classList.remove('hidden');
    }

    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render webcam background faintly mirrored
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);
      ctx.globalAlpha = 0.2;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      // Finger Detection (Landmark 8 = Index Finger Tip)
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        rawX = (1 - hand[8].x) * canvas.width; // Flip horizontally
        rawY = hand[8].y * canvas.height;
      }

      // Smooth Movement Lerp
      playerX += (rawX - playerX) * 0.3;
      playerY += (rawY - playerY) * 0.3;

      if (!isGameOver) {
        // Draw Catcher (Glowing Ring)
        ctx.beginPath();
        ctx.arc(playerX, playerY, 22, 0, 2 * Math.PI);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#38bdf8';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Spawn logic
        if (Math.random() < 0.04) {
          spawnItem();
        }

        // Process Objects
        for (let i = items.length - 1; i >= 0; i--) {
          let item = items[i];
          item.y += item.speed;

          // Render Objects
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius, 0, 2 * Math.PI);
          if (item.isBomb) {
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
          } else {
            ctx.fillStyle = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f59e0b';
          }
          ctx.fill();
          ctx.shadowBlur = 0;

          // Collision Detection
          let dist = Math.hypot(playerX - item.x, playerY - item.y);
          if (dist < 22 + item.radius) {
            if (item.isBomb) {
              endGame();
              break;
            } else {
              score += 10;
              scoreEl.innerText = score;
              speedMultiplier += 0.03; // Speed scales up smoothly
              items.splice(i, 1);
              continue;
            }
          }

          // Missed star penalty (Bottom wall hit)
          if (item.y > canvas.height + 20) {
            if (!item.isBomb) {
              endGame();
              break;
            } else {
              items.splice(i, 1); // Safely drop bombs
            }
          }
        }
      }
    }

    // Initialize Hands Engine
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // Initialize Camera Stream
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
